services:
  postgres:
    image: postgres:17
    container_name: url-shortener-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: ozon-url-shortener
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/urlshortener
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: